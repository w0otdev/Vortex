[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/connectors/imap",
    "crates/otp",
    "crates/classify",
    "crates/daemon",
    "crates/ui-web",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vortex-inbox/vortex"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "process"] }
native-tls = "0.2"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
sha2 = "0.10"
base64 = "0.22"
tao = "0.30"
wry = "0.47"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
