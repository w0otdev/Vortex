<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vortex OTP</title>
  <style>
    @font-face { font-family: "Vortex SF Pro"; src: local("SF Pro Display Bold"), local("SFProDisplay-Bold"); font-weight: 700; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body { padding: 3px 4px 6px; font: 700 13px/1.3 "Vortex SF Pro", -apple-system, system-ui, "Segoe UI", sans-serif; color: #181816; user-select: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .list { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 100%; }
    .card { height: 74px; flex: 0 0 74px; display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; border: 1px solid #8c8c84; border-radius: 16px; background: #fafaf7; box-shadow: inset 0 1px 0 #fafaf7, inset 0 -1px 0 #d6d6d0, 0 3px 0 #707068; }
    .card-main { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 10px; padding: 0; border: 0; background: transparent; text-align: left; }
    .card-main:active { transform: translateY(1px); }
    .code { flex-shrink: 0; font-size: 1.32rem; font-variant-numeric: tabular-nums; letter-spacing: .03em; color: #181816; }
    .details { flex: 1; min-width: 0; }
    .sender, .recipient, .time { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sender { font-size: 13px; color: #181816; }
    .recipient, .time { color: #52504a; font-size: 11px; }
    .copy-icon { flex-shrink: 0; width: 16px; height: 16px; fill: #383835; }
    .close { flex: 0 0 26px; width: 26px; height: 26px; padding: 0; border: 1px solid #a5a59d; border-radius: 999px; background: #e8e8e3; box-shadow: 0 2px 0 #707068; font-size: 16px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .close:active { transform: translateY(1px); box-shadow: none; }
    :focus-visible { outline: 2px solid #181816; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="list" class="list" aria-label="Các mã xác nhận"></div>
  <script>
  (() => {
    const list = document.getElementById("list");
    let codes = [], previousKey = "", dismissedHashes = new Set(), announced = new Set(), copiedHash = "";
    const signal = (action) => { if (window.ipc) window.ipc.postMessage("otp-overlay:" + action); };
    const identity = (c) => c.code_hash || String(c.item_id) + ":" + c.code;
    const recipient = (c) => c.recipient || c.account || "Không rõ hộp thư";
    async function copy(c) {
      try { await navigator.clipboard.writeText(c.code); } catch (_) { return; }
      copiedHash = identity(c);
      previousKey = "";
      render();
      setTimeout(() => { if (copiedHash === identity(c)) { copiedHash = ""; previousKey = ""; render(); } }, 1800);
      fetch("/api/clipboard/copy", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: c.code }) }).catch(() => {});
    }
    function dismissOne(c, visibleLen) {
      dismissedHashes.add(identity(c));
      previousKey = "";
      if (visibleLen <= 1) {
        signal("hide");
        fetch("/api/codes/clear", { method: "POST" }).catch(() => {});
      } else {
        render();
      }
    }
    function render() {
      const now = Math.floor(Date.now() / 1000);
      const active = codes.filter((c) => c.expires_at > now && !dismissedHashes.has(identity(c))).slice(0, 2);
      const key = JSON.stringify(active) + "|" + copiedHash;
      if (key !== previousKey) {
        previousKey = key;
        list.replaceChildren();
        active.forEach((c) => {
          const sender = (c.sender || c.service || "Không rõ người gửi").replace(/\s*<[^>]*>\s*$/, "").replace(/^['\"]|['\"]$/g, "").trim();
          const to = recipient(c), card = document.createElement("div");
          card.className = "card";
          const mainBtn = document.createElement("button");
          mainBtn.type = "button"; mainBtn.className = "card-main";
          mainBtn.setAttribute("aria-label", "Sao chép mã " + c.code + ", từ " + sender);
          mainBtn.onclick = () => copy(c);
          const code = document.createElement("span"); code.className = "code"; code.textContent = c.code;
          const details = document.createElement("span"); details.className = "details";
          const from = document.createElement("span"); from.className = "sender"; from.textContent = sender; from.title = c.sender || sender;
          const target = document.createElement("span"); target.className = "recipient"; target.textContent = "Đến: " + to; target.title = to;
          const time = document.createElement("span"); time.className = "time"; time.dataset.expires = c.expires_at; time.dataset.hash = identity(c);
          const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg"); icon.setAttribute("viewBox", "0 0 20 20"); icon.setAttribute("class", "copy-icon"); icon.setAttribute("aria-hidden", "true");
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path"); path.setAttribute("d", "M7.5 2.5A2.5 2.5 0 0 0 5 5v1h7a2 2 0 0 1 2 2v7h1a2.5 2.5 0 0 0 2.5-2.5V7.3a2.5 2.5 0 0 0-.73-1.77l-2.3-2.3A2.5 2.5 0 0 0 12.7 2.5H7.5ZM3 8a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8Z"); icon.appendChild(path);
          const closeBtn = document.createElement("button");
          closeBtn.type = "button"; closeBtn.className = "close"; closeBtn.textContent = "×"; closeBtn.title = "Đóng";
          closeBtn.onclick = (e) => { e.stopPropagation(); dismissOne(c, active.length); };
          details.append(from, target, time);
          mainBtn.append(code, details, icon);
          card.append(mainBtn, closeBtn);
          list.appendChild(card);
        });
      }
      list.querySelectorAll(".time").forEach((node) => {
        if (copiedHash && node.dataset.hash === copiedHash) {
          node.textContent = "Đã sao chép mã";
          return;
        }
        const remaining = Math.max(0, Number(node.dataset.expires) - now);
        node.textContent = "Còn " + Math.floor(remaining / 60) + "p " + (remaining % 60) + "s";
      });
      const current = new Set(active.map(identity));
      const hasNew = [...current].some((id) => !announced.has(id));
      announced = current;
      if (active.length > 0 && hasNew) {
        signal("show:" + active.length);
      } else if (active.length > 0) {
        signal("resize:" + active.length);
      } else {
        signal("hide");
      }
    }
    let polling = false, refreshPending = false;
    async function poll() {
      if (polling) { refreshPending = true; return; }
      polling = true;
      try {
        do {
          refreshPending = false;
          const response = await fetch("/api/codes", { cache: "no-store" });
          if (response.ok) { codes = await response.json(); render(); }
        } while (refreshPending);
      } catch (_) {} finally {
        polling = false;
      }
    }
    window.refreshOtpOverlay = poll;
    poll(); setInterval(poll, 1500); setInterval(render, 1000);
  })();
  </script>
</body>
</html>
